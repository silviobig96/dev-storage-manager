[workspace]
resolver = "2"
members = [
    "crates/application",
    "crates/core",
    "crates/persistence",
    "crates/platform",
    "src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
